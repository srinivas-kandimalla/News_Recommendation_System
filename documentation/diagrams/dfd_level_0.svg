<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background-color: #0F172A; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="darr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <text x="400" y="35" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">DATA FLOW DIAGRAM (DFD LEVEL 0 / CONTEXT DIAGRAM)</text>

  <!-- Entities -->
  <!-- User -->
  <rect x="50" y="180" width="140" height="70" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="120" y="215" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">User / Client</text>
  <text x="120" y="235" text-anchor="middle" fill="#94A3B8" font-size="11">(Web Browser)</text>

  <!-- Central System -->
  <circle cx="400" cy="215" r="90" fill="#0284C7" stroke="#38BDF8" stroke-width="3"/>
  <text x="400" y="205" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">0.0 NEXORA</text>
  <text x="400" y="225" text-anchor="middle" fill="#E2E8F0" font-size="12">AI Recommendation</text>
  <text x="400" y="240" text-anchor="middle" fill="#E2E8F0" font-size="12">System</text>

  <!-- External GNews API -->
  <rect x="610" y="180" width="140" height="70" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="680" y="215" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">GNews API</text>
  <text x="680" y="235" text-anchor="middle" fill="#94A3B8" font-size="11">(External Provider)</text>

  <!-- Data Flows -->
  <!-- User to Nexora -->
  <path d="M 190 195 L 310 195" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#darr)"/>
  <text x="250" y="188" text-anchor="middle" fill="#E2E8F0" font-size="10">User Signals, Auth &amp; Clicks</text>

  <!-- Nexora to User -->
  <path d="M 310 235 L 190 235" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#darr)"/>
  <text x="250" y="250" text-anchor="middle" fill="#38BDF8" font-size="10">Personalized Feed &amp; Rationales</text>

  <!-- GNews to Nexora -->
  <path d="M 610 215 L 490 215" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#darr)"/>
  <text x="550" y="208" text-anchor="middle" fill="#E2E8F0" font-size="10">Raw Breaking News Data</text>
</svg>
