<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background-color: #0F172A; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="sarr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <text x="500" y="35" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">GET /personalized-recommendations SEQUENCE DIAGRAM</text>

  <!-- Actors / Lifelines -->
  <!-- Client -->
  <rect x="60" y="65" width="120" height="35" rx="6" fill="#0284C7"/>
  <text x="120" y="87" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">React Client</text>
  <line x1="120" y1="100" x2="120" y2="580" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- Middleware -->
  <rect x="270" y="65" width="120" height="35" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="330" y="87" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700">JWT Guard</text>
  <line x1="330" y1="100" x2="330" y2="580" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- Controller & Service -->
  <rect x="480" y="65" width="140" height="35" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="550" y="87" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700">Rec Service</text>
  <line x1="550" y1="100" x2="550" y2="580" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- PyTorch Ranker -->
  <rect x="700" y="65" width="130" height="35" rx="6" fill="#2563EB"/>
  <text x="765" y="87" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">PyTorch Ranker</text>
  <line x1="765" y1="100" x2="765" y2="580" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- MongoDB -->
  <rect x="880" y="65" width="100" height="35" rx="6" fill="#0284C7"/>
  <text x="930" y="87" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">MongoDB</text>
  <line x1="930" y1="100" x2="930" y2="580" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- Messages -->
  <!-- 1. GET Request -->
  <line x1="120" y1="130" x2="330" y2="130" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#sarr)"/>
  <text x="225" y="123" text-anchor="middle" fill="#E2E8F0" font-size="11">1. GET /personalized-recommendations (Bearer Token)</text>

  <!-- 2. Verify Token -->
  <line x1="330" y1="170" x2="550" y2="170" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#sarr)"/>
  <text x="440" y="163" text-anchor="middle" fill="#E2E8F0" font-size="11">2. Token Validated (user_id extracted)</text>

  <!-- 3. Fetch User History -->
  <line x1="550" y1="210" x2="930" y2="210" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#sarr)"/>
  <text x="740" y="203" text-anchor="middle" fill="#E2E8F0" font-size="11">3. Fetch reading_history &amp; reactions</text>

  <!-- 4. Return History -->
  <line x1="930" y1="250" x2="550" y2="250" stroke="#94A3B8" stroke-dasharray="4,4"/>
  <text x="740" y="243" text-anchor="middle" fill="#94A3B8" font-size="11">4. User History Docs Returned</text>

  <!-- 5. Fetch News Candidates -->
  <line x1="550" y1="290" x2="930" y2="290" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#sarr)"/>
  <text x="740" y="283" text-anchor="middle" fill="#E2E8F0" font-size="11">5. Fetch unread candidates (Compound Index)</text>

  <!-- 6. Return Candidates -->
  <line x1="930" y1="330" x2="550" y2="330" stroke="#94A3B8" stroke-dasharray="4,4"/>
  <text x="740" y="323" text-anchor="middle" fill="#94A3B8" font-size="11">6. Candidate Stories Returned</text>

  <!-- 7. Attention & Feature Extractor -->
  <rect x="510" y="355" width="80" height="35" rx="4" fill="#334155"/>
  <text x="550" y="377" text-anchor="middle" fill="#38BDF8" font-size="10">1159-d Vector</text>

  <!-- 8. Model Inference -->
  <line x1="550" y1="415" x2="765" y2="415" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#sarr)"/>
  <text x="657" y="408" text-anchor="middle" fill="#E2E8F0" font-size="11">8. Batch MLP Inference (1159-d input)</text>

  <!-- 9. Scores Returned -->
  <line x1="765" y1="455" x2="550" y2="455" stroke="#94A3B8" stroke-dasharray="4,4"/>
  <text x="657" y="448" text-anchor="middle" fill="#94A3B8" font-size="11">9. P(click) Scores Returned</text>

  <!-- 10. ILD Rerank -->
  <rect x="510" y="475" width="80" height="30" rx="4" fill="#334155"/>
  <text x="550" y="495" text-anchor="middle" fill="#38BDF8" font-size="10">ILD Rerank</text>

  <!-- 11. Final Response -->
  <line x1="550" y1="535" x2="120" y2="535" stroke="#38BDF8" stroke-width="2" marker-end="url(#sarr)"/>
  <text x="335" y="528" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="700">11. HTTP 200 OK (JSON Payload + Transparent AI Rationales)</text>
</svg>
