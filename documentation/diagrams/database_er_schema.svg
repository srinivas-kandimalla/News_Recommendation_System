<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0F172A; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <text x="500" y="40" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">NEXORA — MONGODB DOCUMENT SCHEMA &amp; ER DIAGRAM</text>
  <text x="500" y="65" text-anchor="middle" fill="#94A3B8" font-size="13">Database: news_recommendation_db (5 Collections &amp; Relational References)</text>

  <!-- Collection: users -->
  <rect x="50" y="100" width="260" height="230" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="50" y="100" width="260" height="35" rx="8" fill="#0284C7"/>
  <text x="180" y="123" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">users</text>
  <text x="65" y="155" fill="#38BDF8" font-size="11" font-family="monospace">_id: ObjectId (PK)</text>
  <text x="65" y="175" fill="#E2E8F0" font-size="11">email: String (Unique Index)</text>
  <text x="65" y="195" fill="#E2E8F0" font-size="11">password: String (Bcrypt Hash)</text>
  <text x="65" y="215" fill="#E2E8F0" font-size="11">role: String ("user" | "admin")</text>
  <text x="65" y="235" fill="#E2E8F0" font-size="11">name: String</text>
  <text x="65" y="255" fill="#E2E8F0" font-size="11">categories: Array[String]</text>
  <text x="65" y="275" fill="#94A3B8" font-size="11">created_at: Datetime</text>

  <!-- Collection: news -->
  <rect x="690" y="100" width="260" height="270" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="690" y="100" width="260" height="35" rx="8" fill="#0284C7"/>
  <text x="820" y="123" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">news</text>
  <text x="705" y="155" fill="#38BDF8" font-size="11" font-family="monospace">_id: ObjectId (PK)</text>
  <text x="705" y="175" fill="#E2E8F0" font-size="11">title: String</text>
  <text x="705" y="195" fill="#E2E8F0" font-size="11">content: String</text>
  <text x="705" y="215" fill="#E2E8F0" font-size="11">category: String (Indexed)</text>
  <text x="705" y="235" fill="#E2E8F0" font-size="11">author: String</text>
  <text x="705" y="255" fill="#E2E8F0" font-size="11">published_at: Datetime (Indexed)</text>
  <text x="705" y="275" fill="#E2E8F0" font-size="11">url: String (Unique Index)</text>
  <text x="705" y="295" fill="#E2E8F0" font-size="11">image_url: String</text>
  <text x="705" y="315" fill="#38BDF8" font-size="11">embedding: Array[Float] (384-d)</text>
  <text x="705" y="335" fill="#94A3B8" font-size="11">likes_count / reads_count: Int</text>

  <!-- Collection: reactions -->
  <rect x="370" y="100" width="260" height="150" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="370" y="100" width="260" height="35" rx="8" fill="#334155"/>
  <text x="500" y="123" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">reactions</text>
  <text x="385" y="155" fill="#38BDF8" font-size="11" font-family="monospace">_id: ObjectId (PK)</text>
  <text x="385" y="175" fill="#F59E0B" font-size="11">user_id: String (FK -> users._id)</text>
  <text x="385" y="195" fill="#F59E0B" font-size="11">news_id: String (FK -> news._id)</text>
  <text x="385" y="215" fill="#E2E8F0" font-size="11">type: String ("like" | "dislike")</text>
  <text x="385" y="235" fill="#94A3B8" font-size="11">created_at: Datetime</text>

  <!-- Collection: bookmarks -->
  <rect x="200" y="420" width="260" height="140" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="200" y="420" width="260" height="35" rx="8" fill="#334155"/>
  <text x="330" y="443" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">bookmarks</text>
  <text x="215" y="475" fill="#38BDF8" font-size="11" font-family="monospace">_id: ObjectId (PK)</text>
  <text x="215" y="495" fill="#F59E0B" font-size="11">user_id: String (FK -> users._id)</text>
  <text x="215" y="515" fill="#F59E0B" font-size="11">news_id: String (FK -> news._id)</text>
  <text x="215" y="535" fill="#94A3B8" font-size="11">created_at: Datetime</text>

  <!-- Collection: reading_history -->
  <rect x="540" y="420" width="260" height="150" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="540" y="420" width="260" height="35" rx="8" fill="#334155"/>
  <text x="670" y="443" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">reading_history</text>
  <text x="555" y="475" fill="#38BDF8" font-size="11" font-family="monospace">_id: ObjectId (PK)</text>
  <text x="555" y="495" fill="#F59E0B" font-size="11">user_id: String (FK -> users._id)</text>
  <text x="555" y="515" fill="#F59E0B" font-size="11">news_id: String (FK -> news._id)</text>
  <text x="555" y="535" fill="#E2E8F0" font-size="11">duration_seconds: Float</text>
  <text x="555" y="555" fill="#94A3B8" font-size="11">timestamp: Datetime</text>

  <!-- Relationship Lines -->
  <path d="M 310 175 L 370 175" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 630 175 L 690 175" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 180 330 L 180 490 L 200 490" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 820 370 L 820 490 L 800 490" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4,4"/>
</svg>
