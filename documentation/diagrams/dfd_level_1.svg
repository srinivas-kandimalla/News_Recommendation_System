<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 600" width="100%" height="100%" style="background-color: #0F172A; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="darr1" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <text x="475" y="35" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">DATA FLOW DIAGRAM (DFD LEVEL 1 — DECOMPOSITION)</text>

  <!-- External Entity: User -->
  <rect x="40" y="250" width="120" height="60" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="100" y="285" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">User / Client</text>

  <!-- Processes -->
  <!-- 1.0 Auth -->
  <circle cx="270" cy="140" r="50" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
  <text x="270" y="135" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">1.0 Auth &amp;</text>
  <text x="270" y="150" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">User Mgmt</text>

  <!-- 2.0 Ingestion -->
  <circle cx="270" cy="450" r="50" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
  <text x="270" y="445" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">2.0 News</text>
  <text x="270" y="460" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">Ingestion</text>

  <!-- 3.0 Telemetry -->
  <circle cx="500" cy="270" r="50" fill="#0284C7" stroke="#38BDF8" stroke-width="2"/>
  <text x="500" y="265" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">3.0 Interaction</text>
  <text x="500" y="280" text-anchor="middle" fill="#FFF" font-size="12" font-weight="700">Telemetry</text>

  <!-- 4.0 Recommendation Engine -->
  <circle cx="730" cy="270" r="55" fill="#2563EB" stroke="#38BDF8" stroke-width="2"/>
  <text x="730" y="265" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">4.0 Neural</text>
  <text x="730" y="280" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">Recommendation</text>

  <!-- Data Stores -->
  <!-- D1: users -->
  <rect x="420" y="120" width="160" height="40" rx="4" fill="#1E293B" stroke="#334155"/>
  <line x1="450" y1="120" x2="450" y2="160" stroke="#334155"/>
  <text x="435" y="145" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="700">D1</text>
  <text x="505" y="145" text-anchor="middle" fill="#F8FAFC" font-size="12">users</text>

  <!-- D2: news -->
  <rect x="420" y="430" width="160" height="40" rx="4" fill="#1E293B" stroke="#334155"/>
  <line x1="450" y1="430" x2="450" y2="470" stroke="#334155"/>
  <text x="435" y="455" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="700">D2</text>
  <text x="505" y="455" text-anchor="middle" fill="#F8FAFC" font-size="12">news</text>

  <!-- D3: telemetry -->
  <rect x="650" y="430" width="160" height="40" rx="4" fill="#1E293B" stroke="#334155"/>
  <line x1="680" y1="430" x2="680" y2="470" stroke="#334155"/>
  <text x="665" y="455" text-anchor="middle" fill="#38BDF8" font-size="11" font-weight="700">D3</text>
  <text x="735" y="455" text-anchor="middle" fill="#F8FAFC" font-size="12">reactions/history</text>

  <!-- Data Flow Paths -->
  <path d="M 160 260 L 225 160" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#darr1)"/>
  <path d="M 320 140 L 420 140" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#darr1)"/>
  <path d="M 160 280 L 450 270" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#darr1)"/>
  <path d="M 550 270 L 650 450" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#darr1)"/>
  <path d="M 270 400 L 420 450" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#darr1)"/>
  <path d="M 580 450 L 685 320" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#darr1)"/>
  <path d="M 675 270 L 160 290" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#darr1)"/>
</svg>
