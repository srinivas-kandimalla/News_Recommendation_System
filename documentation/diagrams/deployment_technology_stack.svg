<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%" style="background-color: #0F172A; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <text x="450" y="40" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="700">DEPLOYMENT ARCHITECTURE &amp; TECHNOLOGY STACK</text>

  <!-- Presentation Layer -->
  <rect x="80" y="80" width="740" height="110" rx="10" fill="url(#tGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="100" y="110" fill="#38BDF8" font-size="15" font-weight="700">PRESENTATION LAYER (Frontend SPA Client)</text>
  <text x="100" y="135" fill="#F8FAFC" font-size="13">• React 18 &amp; Vite 8.2 • Material-UI (MUI v6) • Chart.js Telemetry</text>
  <text x="100" y="155" fill="#94A3B8" font-size="12">• Axios HTTP Client • React Router 7 • Playwright 1.62 E2E Automation</text>
  <text x="750" y="155" text-anchor="end" fill="#38BDF8" font-size="12" font-weight="600">Port: 5173</text>

  <!-- Application API Layer -->
  <rect x="80" y="210" width="740" height="120" rx="10" fill="url(#tGrad)" stroke="#0284C7" stroke-width="1.5"/>
  <text x="100" y="240" fill="#38BDF8" font-size="15" font-weight="700">APPLICATION &amp; API LAYER (Flask Backend REST Service)</text>
  <text x="100" y="265" fill="#F8FAFC" font-size="13">• Python 3.10+ / Flask 3.x • PyJWT Cryptographic Authentication</text>
  <text x="100" y="285" fill="#94A3B8" font-size="12">• APScheduler 30-Min Ingestion • Flask-CORS Middleware</text>
  <text x="100" y="305" fill="#94A3B8" font-size="12">• NumPy Vectorized Computations • SciPy &amp; Scikit-Learn Metrics</text>
  <text x="750" y="305" text-anchor="end" fill="#38BDF8" font-size="12" font-weight="600">Port: 5000</text>

  <!-- AI & Deep Learning Inference Layer -->
  <rect x="80" y="350" width="740" height="110" rx="10" fill="url(#tGrad)" stroke="#2563EB" stroke-width="2"/>
  <text x="100" y="380" fill="#38BDF8" font-size="15" font-weight="700">AI &amp; DEEP LEARNING INFERENCE ENGINE</text>
  <text x="100" y="405" fill="#FFFFFF" font-size="13" font-weight="600">• PyTorch 2.x Neural Ranker (1159-d MLP: 1159 $ightarrow$ 128 $ightarrow$ 64 $ightarrow$ 1)</text>
  <text x="100" y="425" fill="#E2E8F0" font-size="12">• SentenceTransformers (all-MiniLM-L6-v2, 384-d Dense Embedding Space)</text>
  <text x="100" y="445" fill="#94A3B8" font-size="12">• Softmax Candidate-Aware Attention (Temperature τ = 0.1) &amp; ILD Reranker</text>

  <!-- Database & Storage Layer -->
  <rect x="80" y="480" width="740" height="100" rx="10" fill="url(#tGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="100" y="510" fill="#38BDF8" font-size="15" font-weight="700">DATABASE &amp; PERSISTENCE LAYER</text>
  <text x="100" y="535" fill="#F8FAFC" font-size="13">• MongoDB 7.0 Document Database (PyMongo Driver)</text>
  <text x="100" y="555" fill="#94A3B8" font-size="12">• Collections: users, news, reactions, bookmarks, reading_history</text>
  <text x="750" y="555" text-anchor="end" fill="#38BDF8" font-size="12" font-weight="600">Port: 27017</text>
</svg>
