<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%" style="background-color: #0F172A; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="uarr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <text x="450" y="35" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="700">USER JOURNEY &amp; INTERACTION FLOW</text>

  <!-- Start -->
  <rect x="350" y="65" width="200" height="40" rx="20" fill="#0284C7"/>
  <text x="450" y="90" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">User visits http://localhost:5173</text>

  <path d="M 450 105 L 450 130" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#uarr)"/>

  <!-- Decision: Authenticated? -->
  <polygon points="450,130 550,165 450,200 350,165" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="450" y="170" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="600">Authenticated?</text>

  <!-- No: Login / Register -->
  <path d="M 350 165 L 200 165 L 200 220" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#uarr)"/>
  <text x="275" y="158" text-anchor="middle" fill="#94A3B8" font-size="11">No</text>

  <rect x="110" y="220" width="180" height="50" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="200" y="243" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="600">Login / Register</text>
  <text x="200" y="258" text-anchor="middle" fill="#94A3B8" font-size="10">JWT Token Issued</text>

  <path d="M 200 270 L 200 315 L 350 315" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#uarr)"/>

  <!-- Yes: Home Feed -->
  <path d="M 450 200 L 450 290" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#uarr)"/>
  <text x="465" y="235" text-anchor="middle" fill="#38BDF8" font-size="11">Yes</text>

  <rect x="350" y="290" width="200" height="50" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="450" y="313" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="700">Home Feed Grid</text>
  <text x="450" y="328" text-anchor="middle" fill="#94A3B8" font-size="10">Browse News Briefings</text>

  <path d="M 450 340 L 450 375" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#uarr)"/>

  <!-- Actions Row -->
  <rect x="60" y="375" width="180" height="60" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="150" y="400" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="600">Open News Details</text>
  <text x="150" y="418" text-anchor="middle" fill="#94A3B8" font-size="10">Telemetry Read Log</text>

  <rect x="270" y="375" width="180" height="60" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="360" y="400" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="600">Like / Dislike / Bookmark</text>
  <text x="360" y="418" text-anchor="middle" fill="#94A3B8" font-size="10">Signals Saved to DB</text>

  <rect x="480" y="375" width="180" height="60" rx="8" fill="#2563EB" stroke="#38BDF8"/>
  <text x="570" y="400" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">View "For You"</text>
  <text x="570" y="418" text-anchor="middle" fill="#E2E8F0" font-size="10">Neural Recommendations</text>

  <rect x="690" y="375" width="160" height="60" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="770" y="400" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="600">Analytics &amp; Admin</text>
  <text x="770" y="418" text-anchor="middle" fill="#94A3B8" font-size="10">Telemetry &amp; Stats</text>

  <path d="M 450 340 L 150 375" stroke="#94A3B8" stroke-width="1.5"/>
  <path d="M 450 340 L 360 375" stroke="#94A3B8" stroke-width="1.5"/>
  <path d="M 450 340 L 570 375" stroke="#38BDF8" stroke-width="1.5"/>
  <path d="M 450 340 L 770 375" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- End / Logout -->
  <path d="M 570 435 L 570 510" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#uarr)"/>

  <rect x="470" y="510" width="200" height="45" rx="8" fill="#0284C7"/>
  <text x="570" y="538" text-anchor="middle" fill="#FFF" font-size="13" font-weight="700">Session End / Logout</text>
</svg>
